<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>选股实时监控</title>
<style>
/* ============ 基础 ============ */
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  background: #080c12;
  color: #c8cdd4;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ============ 顶部 Header ============ */
.header {
  background: linear-gradient(180deg, #101520 0%, #0d1119 100%);
  border-bottom: 1px solid #1a2230;
  padding: 14px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
  will-change: backdrop-filter;
}
.header h1 {
  font-size: 17px;
  font-weight: 600;
  color: #e4e8ee;
  display: flex;
  align-items: center;
  gap: 12px;
  letter-spacing: 0.4px;
}
.status-dot {
  width: 9px; height: 9px;
  border-radius: 50%;
  display: inline-block;
  transition: background .25s, box-shadow .25s;
}
.status-dot.connected    { background: #4ade80; box-shadow: 0 0 8px rgba(74, 222, 128, .4); }
.status-dot.disconnected { background: #ef4444; box-shadow: 0 0 8px rgba(239, 68, 68, .35); }
.status-dot.connecting   { background: #f59e0b; box-shadow: 0 0 8px rgba(245, 158, 11, .35); animation: pulse 1.2s ease-in-out infinite; }

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50%      { opacity: .35; }
}

.header-right {
  display: flex;
  align-items: center;
  gap: 14px;
  font-size: 13px;
  color: #5e6670;
}
.addr-input {
  background: #0a0e16;
  border: 1px solid #1e2735;
  border-radius: 6px;
  color: #c8cdd4;
  padding: 6px 10px;
  font-size: 13px;
  font-family: "SF Mono", Consolas, monospace;
  width: 200px;
  outline: none;
  transition: border-color .2s;
}
.addr-input:focus { border-color: #5b9de0; box-shadow: 0 0 0 2px rgba(91, 157, 224, .12); }
.addr-input::placeholder { color: #3a4049; }
.addr-btn {
  background: #2a4a7f;
  color: #e4e8ee;
  border: 1px solid #345899;
  border-radius: 6px;
  padding: 6px 14px;
  font-size: 13px;
  cursor: pointer;
  font-weight: 500;
  transition: background .15s;
}
.addr-btn:hover { background: #345899; }
.update-time { color: #5b9de0; font-family: "SF Mono", Consolas, monospace; font-size: 13px; }

/* ============ 三面板网格布局：上小下大 ============ */
.container {
  display: grid;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: minmax(180px, 38fr) minmax(0, 62fr);
  gap: 14px;
  padding: 14px 28px 20px;
  flex: 1;
  min-height: 0;
  overflow: hidden;
}
.panel.full {
  grid-column: 1 / -1;
  grid-row: 2 / 3;
}
.panel {
  background: #0d1119;
  border: 1px solid #1a2230;
  border-radius: 10px;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  min-height: 0;
}
.panel-header {
  padding: 14px 18px;
  border-bottom: 1px solid #1a2230;
  background: linear-gradient(180deg, #101620 0%, #0d1119 100%);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-shrink: 0;
}
.panel-title {
  font-size: 14px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 9px;
  color: #d0d5dd;
  letter-spacing: 0.3px;
}
.panel-title .icon { font-size: 15px; }
.panel-title.buy     .icon { color: #f03d43; }
.panel-title.sell    .icon { color: #2db954; }
.panel-title.history .icon { color: #5b9de0; }
.badge {
  background: #151d2a;
  color: #5e6670;
  font-size: 12px;
  padding: 3px 10px;
  border-radius: 12px;
  font-weight: 500;
  border: 1px solid #1a2230;
}
.panel-body {
  flex: 1;
  overflow-y: auto;
  min-height: 0;
  position: relative;
}
.panel-body::-webkit-scrollbar { width: 5px; }
.panel-body::-webkit-scrollbar-track { background: transparent; }
.panel-body::-webkit-scrollbar-thumb { background: #1e2735; border-radius: 3px; }
.panel-body::-webkit-scrollbar-thumb:hover { background: #283548; }

/* ============ 表格 ============ */
table {
  width: 100%;
  border-collapse: collapse;
}
thead { position: sticky; top: 0; z-index: 1; }
th {
  background: #101620;
  padding: 10px 14px;
  text-align: left;
  font-size: 11px;
  font-weight: 500;
  color: #4a5360;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  border-bottom: 1px solid #1a2230;
}
td {
  padding: 10px 14px;
  font-size: 13px;
  border-bottom: 1px solid #131a26;
  font-family: "SF Mono", Consolas, "Liberation Mono", Menlo, monospace;
  color: #b8c0cc;
  transition: background .12s;
}
tr:hover td { background: #111824; }

.positive { color: #f03d43; }
.negative { color: #2db954; }

.empty-state {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: #2a3340;
  font-size: 14px;
  letter-spacing: 0.3px;
}

/* ============ Toast ============ */
.toast-container {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.toast {
  background: #101520;
  border: 1px solid #1a2230;
  border-radius: 8px;
  padding: 12px 18px;
  font-size: 13px;
  color: #c8cdd4;
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 220px;
  box-shadow: 0 8px 24px rgba(0,0,0,.45);
  animation: toastIn .3s ease;
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  will-change: backdrop-filter;
}
.toast.success { border-left: 3px solid #4ade80; }
.toast.error   { border-left: 3px solid #ef4444; }
.toast.info    { border-left: 3px solid #5b9de0; }
@keyframes toastIn  { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
@keyframes toastOut { from { transform: translateX(0);    opacity: 1; } to { transform: translateX(100%); opacity: 0; } }
</style>
</head>
<body>

<div class="header">
  <h1>
    <span class="status-dot disconnected" id="statusDot"></span>
    <span>选股实时监控</span>
  </h1>
  <div class="header-right">
    <div>
      <input class="addr-input" id="addrInput" placeholder="localhost:9090" />
      <button class="addr-btn" onclick="onConnectClick()">连接</button>
    </div>
    <span>更新: <span class="update-time" id="updateTime">--</span></span>
  </div>
</div>

<div class="container">
  <!-- 当日买点 -->
  <div class="panel">
    <div class="panel-header">
      <div class="panel-title buy"><span class="icon">&#9650;</span> 买点信号</div>
      <span class="badge" id="buyCount">0</span>
    </div>
    <div class="panel-body">
      <div class="empty-state" id="buyEmpty">等待买点数据...</div>
      <table id="buyTable" style="display:none;">
        <thead><tr>
          <th>代码</th><th>名称</th><th>价格</th><th>涨幅</th><th>时间</th>
        </tr></thead>
        <tbody id="buyTbody"></tbody>
      </table>
    </div>
  </div>

  <!-- 当日卖点 -->
  <div class="panel">
    <div class="panel-header">
      <div class="panel-title sell"><span class="icon">&#9660;</span> 卖点信号</div>
      <span class="badge" id="sellCount">0</span>
    </div>
    <div class="panel-body">
      <div class="empty-state" id="sellEmpty">等待卖点数据...</div>
      <table id="sellTable" style="display:none;">
        <thead><tr>
          <th>代码</th><th>名称</th><th>买入价</th><th>卖出价</th><th>收益率</th><th>买入时间</th><th>卖出时间</th>
        </tr></thead>
        <tbody id="sellTbody"></tbody>
      </table>
    </div>
  </div>

  <!-- 历史买卖点（跨两列） -->
  <div class="panel full">
    <div class="panel-header">
      <div class="panel-title history"><span class="icon">&#9632;</span> 历史买卖点</div>
      <div style="display:flex; gap:14px; align-items:center;">
        <span style="font-size:12px; color:#8a93a3;">总收益: <span id="historyTotalRate" style="font-weight:600;">-</span></span>
        <span style="font-size:12px; color:#8a93a3;">已卖出: <span id="historySoldRate" style="font-weight:600;">-</span></span>
        <span style="font-size:12px; color:#8a93a3;">持有中: <span id="historyHoldRate" style="font-weight:600;">-</span></span>
        <span class="badge" id="historyCount">0</span>
      </div>
    </div>
    <div class="panel-body">
      <div class="empty-state" id="historyEmpty">等待历史数据...</div>
      <table id="historyTable" style="display:none;">
        <thead><tr>
          <th>时间</th><th>代码</th><th>名称</th><th>买入价</th><th>卖出/现价</th><th>收益率</th><th>卖出时间</th><th>状态</th>
        </tr></thead>
        <tbody id="historyTbody"></tbody>
      </table>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
'use strict';

// 全局错误捕获
window.onerror = function(msg, url, line, col, err) {
  console.error('[全局错误]', msg, line, col, err);
  return true;
};
window.onunhandledrejection = function(e) {
  console.error('[未处理Promise]', e.reason);
};

// =========================================================
// 全局状态
// =========================================================
const DEFAULT_ADDR = 'localhost:9090';
let currentAddr = '';
let ws = null;
let reconnectTimer = null;
let reconnectAttempts = 0;

// =========================================================
// 工具：格式化
// =========================================================
function fmtNumber(v, digits) {
  if (v == null || isNaN(v)) return '-';
  return Number(v).toFixed(digits);
}
function fmtPrice(v) { return fmtNumber(v, 2); }
function fmtRate(v) {
  if (v == null || isNaN(v)) return '-';
  const n = Number(v);
  const cls = n >= 0 ? 'positive' : 'negative';
  const sign = n >= 0 ? '+' : '';
  return '<span class="' + cls + '">' + sign + n.toFixed(2) + '%</span>';
}
// 从 "2025-06-10 15:00:00" 提取 "15:00:00"
function fmtTime(s) {
  if (!s || s.length < 19) return s || '-';
  return s.substring(11, 19);
}
// 从 "2025-06-10 15:00:00" 提取 "06-10 15:00:00"
function fmtMonthTime(s) {
  if (!s || s.length < 19) return s || '-';
  return s.substring(5, 19);
}
function esc(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, function(c) {
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}

// =========================================================
// Toast 通知
// =========================================================
function showToast(message, type) {
  const container = document.getElementById('toastContainer');
  const toast = document.createElement('div');
  toast.className = 'toast ' + (type || 'info');
  const icons = { success: '\u2713', error: '\u2717', info: '\u2139' };
  toast.innerHTML = '<span>' + (icons[type] || '') + '</span><span>' + esc(message) + '</span>';
  container.appendChild(toast);
  setTimeout(function() {
    toast.style.animation = 'toastOut 0.3s ease forwards';
    setTimeout(function() { toast.remove(); }, 300);
  }, 4000);
}

// =========================================================
// 连接管理
// =========================================================
function setStatus(status) {
  const dot = document.getElementById('statusDot');
  dot.className = 'status-dot ' + status;
}

function connect() {
  if (!currentAddr) { setStatus('disconnected'); return; }
  setStatus('connecting');

  const url = 'ws://' + currentAddr + '/ws';
  try {
    ws = new WebSocket(url);
  } catch (e) {
    showToast('WebSocket 创建失败: ' + e.message, 'error');
    scheduleReconnect();
    return;
  }

  ws.onopen = function() {
    setStatus('connected');
    reconnectAttempts = 0;
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    showToast('已连接到 ' + currentAddr, 'success');
  };

  ws.onclose = function() {
    setStatus('disconnected');
    if (reconnectAttempts === 0) {
      showToast('连接已断开，尝试重连...', 'error');
    }
    scheduleReconnect();
  };

  ws.onerror = function() {
    // onerror 后会触发 onclose，避免重复提示
  };

  ws.onmessage = function(event) {
    let data;
    try { data = JSON.parse(event.data); } catch (e) { return; }
    switch (data.type) {
      case 'buy':     updateBuy(data); break;
      case 'sell':    updateSell(data); break;
      case 'history': updateHistory(data); break;
    }
  };
}

function scheduleReconnect() {
  if (reconnectTimer) return;
  reconnectAttempts++;
  const delay = Math.min(1000 * Math.pow(2, Math.min(reconnectAttempts, 5)), 30000);
  reconnectTimer = setTimeout(function() {
    reconnectTimer = null;
    connect();
  }, delay);
}

function onConnectClick() {
  const addr = document.getElementById('addrInput').value.trim();
  if (!addr) {
    showToast('请输入服务地址', 'error');
    return;
  }
  if (ws) { try { ws.close(); } catch(e) {} ws = null; }
  if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
  reconnectAttempts = 0;

  currentAddr = addr;
  // 通过本地 HTTP 接口持久化
  fetch('/api/addr/save', { method: 'POST', body: addr }).catch(function(){});
  connect();
}

// =========================================================
// 渲染：当日买点
// =========================================================
function updateBuy(data) {
  document.getElementById('updateTime').textContent = fmtTime(data.time);
  const results = data.results || [];
  document.getElementById('buyCount').textContent = data.count != null ? data.count : results.length;

  const table = document.getElementById('buyTable');
  const empty = document.getElementById('buyEmpty');
  const tbody = document.getElementById('buyTbody');

  if (results.length === 0) {
    table.style.display = 'none';
    empty.style.display = 'flex';
    tbody.innerHTML = '';
    return;
  }
  empty.style.display = 'none';
  table.style.display = 'table';

  let html = '';
  for (const r of results) {
    html += '<tr>'
      + '<td>' + esc(r.code) + '</td>'
      + '<td>' + esc(r.name) + '</td>'
      + '<td>' + fmtPrice(r.price) + '</td>'
      + '<td>' + fmtRate(r.rise) + '</td>'
      + '<td>' + fmtTime(r.time) + '</td>'
      + '</tr>';
  }
  tbody.innerHTML = html;
}

// =========================================================
// 渲染：当日卖点
// =========================================================
function updateSell(data) {
  document.getElementById('updateTime').textContent = fmtTime(data.time);
  const results = data.results || [];
  document.getElementById('sellCount').textContent = data.count != null ? data.count : results.length;

  const table = document.getElementById('sellTable');
  const empty = document.getElementById('sellEmpty');
  const tbody = document.getElementById('sellTbody');

  if (results.length === 0) {
    table.style.display = 'none';
    empty.style.display = 'flex';
    tbody.innerHTML = '';
    return;
  }
  empty.style.display = 'none';
  table.style.display = 'table';

  let html = '';
  for (const r of results) {
    html += '<tr>'
      + '<td>' + esc(r.code) + '</td>'
      + '<td>' + esc(r.name) + '</td>'
      + '<td>' + fmtPrice(r.buy_price) + '</td>'
      + '<td>' + fmtPrice(r.sell_price) + '</td>'
      + '<td>' + fmtRate(r.profit_rate) + '</td>'
      + '<td>' + fmtMonthTime(r.buy_time) + '</td>'
      + '<td>' + fmtMonthTime(r.sell_time) + '</td>'
      + '</tr>';
  }
  tbody.innerHTML = html;
}

// =========================================================
// 渲染：历史买点
// =========================================================
function updateHistory(data) {
  const results = data.results || [];
  document.getElementById('historyCount').textContent = data.total != null ? data.total : results.length;

  // 计算整体收益（等权平均：每笔买点权重相同）
  let soldSum = 0, soldCnt = 0, holdSum = 0, holdCnt = 0;
  for (const r of results) {
    const rate = r.income_rate || 0;
    if (r.sold) { soldSum += rate; soldCnt++; }
    else        { holdSum += rate; holdCnt++; }
  }
  const totalCnt = soldCnt + holdCnt;
  const totalAvg = totalCnt > 0 ? (soldSum + holdSum) / totalCnt : 0;
  const soldAvg  = soldCnt  > 0 ? soldSum / soldCnt : 0;
  const holdAvg  = holdCnt  > 0 ? holdSum / holdCnt : 0;
  document.getElementById('historyTotalRate').innerHTML = totalCnt > 0 ? fmtRate(totalAvg) : '-';
  document.getElementById('historySoldRate').innerHTML  = soldCnt  > 0 ? fmtRate(soldAvg)  + ' (' + soldCnt + ')' : '-';
  document.getElementById('historyHoldRate').innerHTML  = holdCnt  > 0 ? fmtRate(holdAvg)  + ' (' + holdCnt + ')' : '-';

  const table = document.getElementById('historyTable');
  const empty = document.getElementById('historyEmpty');
  const tbody = document.getElementById('historyTbody');

  if (results.length === 0) {
    table.style.display = 'none';
    empty.style.display = 'flex';
    tbody.innerHTML = '';
    return;
  }
  empty.style.display = 'none';
  table.style.display = 'table';

  let html = '';
  for (const r of results) {
    const name = r.name || r.code || '-';
    const priceCol = r.sold ? fmtPrice(r.sell_price) : fmtPrice(r.curr_price);
    const statusCol = r.sold
      ? '<span class="negative" style="font-size:12px;">已卖出</span>'
      : '<span class="positive" style="font-size:12px;">持有中</span>';
    html += '<tr>'
      + '<td>' + fmtMonthTime(r.time) + '</td>'
      + '<td>' + esc(r.code) + '</td>'
      + '<td>' + esc(name) + '</td>'
      + '<td>' + fmtPrice(r.price) + '</td>'
      + '<td>' + priceCol + '</td>'
      + '<td>' + fmtRate(r.income_rate) + '</td>'
      + '<td>' + (r.sold ? fmtMonthTime(r.sell_time) : '-') + '</td>'
      + '<td>' + statusCol + '</td>'
      + '</tr>';
  }
  tbody.innerHTML = html;
}

// =========================================================
// 启动入口（页面加载完成后自动调用）
// =========================================================
async function init() {
  // 通过本地 HTTP 接口读取保存的地址
  try {
    const resp = await fetch('/api/addr');
    if (resp.ok) {
      const v = (await resp.text()).trim();
      if (v) currentAddr = v;
    }
  } catch (e) {}
  if (!currentAddr) currentAddr = DEFAULT_ADDR;
  document.getElementById('addrInput').value = currentAddr;
  connect();
}

// 页面就绪后自动启动
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
</body>
</html>
